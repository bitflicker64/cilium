name: Test renovate GID fix
on:
  push:
    branches:
      - test/renovate-gid
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run entrypoint + builder.sh inside the Renovate image
        run: |
          docker run --rm \
            --user root \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/repo \
            -w /repo \
            --entrypoint bash \
            ghcr.io/renovatebot/renovate:43.275.0 \
            /repo/.github/test-gid/test-entry.sh
